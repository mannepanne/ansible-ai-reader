# ABOUT: CI/CD workflow: tests, coverage gate, type check, and worker build on every pull request and push to main
# ABOUT: The deploy steps run only on push to main; a green PR check means tests, coverage, types and the build pass on Node 22, nothing more
# See REFERENCE/operations/deployment.md for setup instructions and troubleshooting

name: Deploy to Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A newer push to the same PR cancels the older run; pushes to main never cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The workflow uses no GITHUB_TOKEN write access; say so, so a repo-settings change cannot widen it
permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    name: Test and Deploy to Cloudflare
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Coverage thresholds live in vitest.config.ts; vitest exits non-zero when any is missed
      - name: Run tests with coverage gate
        run: npx vitest run --coverage

      # A red gate names no file; the HTML report in this artifact does (coverage/index.html)
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint

      - name: Build application
        run: npm run build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}

      # Every deploy step below MUST carry `if: github.event_name == 'push'`. A step without it would
      # run wrangler from a pull request. The steps above are safe to run on a PR; these are not.
      - name: Deploy consumer worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-consumer.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Deploy cron worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-cron.toml
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Relay orchestrator Durable Object — deploys BEFORE the app because the app's DO binding
      # (RELAY_ORCHESTRATOR, script_name) requires this worker to exist. Secrets are set manually
      # (wrangler secret put) and persist; this env block is for parity with the other steps.
      - name: Deploy relay orchestrator worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-relay-orchestrator.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}

      - name: Deploy main application
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
          # Lets the admin "Relay Agent" tab's approve/reject route reach the bridge control plane.
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}

      # Relay bridge deploys LAST: it's the experimental Relay subsystem worker, so a failed
      # deploy here must not gate the production app's redeploy (Actions aborts the job on first
      # failure). READER_API_TOKEN lets the bridge's `fetch` tool pull full article bodies;
      # without it that tool silently degrades to summary-only. PERPLEXITY_API_KEY powers the
      # `research` tool's grounded search; without it that tool fails closed to degraded.
      - name: Deploy relay bridge worker
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-relay-bridge.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RELAY_BRIDGE_TOKEN: ${{ secrets.RELAY_BRIDGE_TOKEN }}
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      # NOTE: the earlier relay session *consumer* (wrangler-relay-session.toml + workers/relay-session-consumer.ts)
      # was REMOVED — superseded by the orchestrator Durable Object above. The Cloudflare ansible-relay-queue /
      # ansible-relay-dlq resources may still exist in the account; delete them manually with
      # `npx wrangler queues delete` once the DO is confirmed the sole path (nothing in-repo references them).
