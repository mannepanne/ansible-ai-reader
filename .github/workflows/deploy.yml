# ABOUT: Automated CI/CD workflow for deploying Ansible AI Reader to Cloudflare Workers
# ABOUT: Runs tests, type checks, builds, and deploys all four workers on every push to main
# See REFERENCE/deployment-guide.md for setup instructions and troubleshooting

name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    name: Test and Deploy to Cloudflare
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Type check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build:worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_CLOUDFLARE_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}

      - name: Deploy consumer worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-consumer.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Deploy cron worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-cron.toml
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      # Relay orchestrator Durable Object — deploys BEFORE the app because the app's DO binding
      # (RELAY_ORCHESTRATOR, script_name) requires this worker to exist. Secrets are set manually
      # (wrangler secret put) and persist; this env block is for parity with the other steps.
      - name: Deploy relay orchestrator worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-relay-orchestrator.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}

      - name: Deploy main application
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}
          # Lets the admin "Relay Agent" tab's approve/reject route reach the bridge control plane.
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}

      # Relay bridge deploys LAST: it's the experimental Relay subsystem worker, so a failed
      # deploy here must not gate the production app's redeploy (Actions aborts the job on first
      # failure). READER_API_TOKEN lets the bridge's `fetch` tool pull full article bodies;
      # without it that tool silently degrades to summary-only.
      - name: Deploy relay bridge worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler-relay-bridge.toml
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RELAY_BRIDGE_TOKEN: ${{ secrets.RELAY_BRIDGE_TOKEN }}
          RELAY_CONTROL_TOKEN: ${{ secrets.RELAY_CONTROL_TOKEN }}
          READER_API_TOKEN: ${{ secrets.READER_API_TOKEN }}

      # NOTE: the relay session *consumer* (wrangler-relay-session.toml) is RETIRED — superseded by the
      # orchestrator Durable Object above. Its worker + ansible-relay-queue can be deleted manually once
      # the DO is confirmed live; the deploy step is removed so it's no longer redeployed.
