# Cloudflare Queue Consumer — Relay session runner
# Runs ONE Managed-Agent session per queued stimulus, then finalizes the verdict via the bridge.
# SETUP: create the queue + DLQ first:
#   npx wrangler queues create ansible-relay-queue
#   npx wrangler queues create ansible-relay-dlq
name = "ansible-relay-session-consumer"
main = "workers/relay-session-consumer.ts"
compatibility_date = "2026-03-06"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Hedge only: the observed "Canceled" kills a long invocation at its END, right after a successful
# network POST + DB write — that is not a CPU-starved invocation, so raising this is unlikely to be
# the real fix (the wall-clock poll budget in the worker is). Kept as a cheap ceiling nonetheless.
[limits]
cpu_ms = 300000

[[queues.consumers]]
queue = "ansible-relay-queue"
max_batch_size = 1        # one stimulus per invocation
max_batch_timeout = 5
max_concurrency = 1       # SERIAL — the T0 verdict-attribution window depends on no overlap (see ADR)
max_retries = 0           # never re-run create-session — a retry would spawn a duplicate agent session
dead_letter_queue = "ansible-relay-dlq"

# Non-secret config: the create-once Managed-Agent resource IDs (from .relay-agent-ids.json) + the
# bridge origin. The consumer never creates resources — it runs a session against these existing ones.
[vars]
RELAY_AGENT_ID = "agent_018jSXwuTvozdYw42bknqR35"
RELAY_ENV_ID = "env_01Pshzu2oPxSwQbW8XMFqy7s"
RELAY_VAULT_ID = "vlt_011CcVXfhTTEZUx6cX5r2w3b"
RELAY_BRIDGE_URL = "https://ansible-relay-bridge.herrings.workers.dev"

# Secrets — set MANUALLY once; they persist across deploys. The deploy.yml `env:` block does NOT
# upload them (wrangler deploy ignores env for secrets). Set each with:
#   wrangler secret put <KEY> --config wrangler-relay-session.toml
#   - ANTHROPIC_API_KEY               Managed Agents API
#   - RELAY_CONTROL_TOKEN             bridge /decision control-plane
#   - NEXT_PUBLIC_SUPABASE_URL        read reader_items
#   - SUPABASE_SECRET_KEY             read reader_items + write sync_log failure breadcrumbs
# Optional (vars or secrets):
#   - RELAY_POLL_INTERVAL_MS          override the 3s poll cadence (ops tuning)
#   - RELAY_POLL_BUDGET_MS            override the wall-clock poll deadline (default 210000 = 3.5 min);
#                                     the worker exits cleanly under the platform cancel point
